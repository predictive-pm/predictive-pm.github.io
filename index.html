<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM·TWIN — Predictive Maintenance · เครื่องล้างหม้อหุงและฝา</title>
<meta name="description" content="Digital Twin + AI (LSTM-Autoencoder) Predictive Maintenance dashboard for the pot & lid washing machine.">
<meta property="og:title" content="PM·TWIN — Predictive Maintenance Digital Twin">
<meta property="og:description" content="ทำนายความล้มเหลวของอุปกรณ์รายส่วน · LSTM-Autoencoder · Digital Twin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpolygon points='20,2 36,11 36,29 20,38 4,29 4,11' fill='%230A0E13' stroke='%2322D3EE' stroke-width='3'/%3E%3Ccircle cx='20' cy='20' r='5' fill='%2322D3EE'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0E13}
a{color:#67E8F9}a:hover{color:#A5F3FC}
*{box-sizing:border-box}
.app{min-height:100vh;color:#E6EDF3;font-family:'IBM Plex Sans Thai','Chakra Petch',system-ui,sans-serif;font-size:14px;line-height:1.5;background-color:#0A0E13;background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:32px 32px}
.disp{font-family:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.panel{background:rgba(15,21,28,.94);border:1px solid #223040;border-radius:10px;position:relative;padding:18px}
.panel::before{content:"";position:absolute;left:-1px;top:-1px;width:14px;height:14px;border-left:2px solid #22D3EE;border-top:2px solid #22D3EE;border-top-left-radius:10px;opacity:.8}
.panel::after{content:"";position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;border-right:2px solid #22D3EE;border-bottom:2px solid #22D3EE;border-bottom-right-radius:10px;opacity:.5}
.lbl{font-family:'Chakra Petch',system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#93A4B6}
.h2{font-family:'Chakra Petch',system-ui,sans-serif;font-size:18px;font-weight:600;margin:0;color:#F1F6FA}
.muted{color:#93A4B6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #2A3A4C;background:#121A23;color:#D5E0EA;font:inherit;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:#18222D;border-color:#3B5068}
.btn.on{background:rgba(34,211,238,.14);border-color:#22D3EE;color:#E6FBFF}
.btn-primary{background:#0E7490;border-color:#22D3EE;color:#fff}
.btn-primary:hover{background:#0B8AAB}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:8px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:#B6C4D2;font:inherit;text-align:left;cursor:pointer;transition:background .15s,color .15s}
.nav-btn:hover{background:#121A23;color:#fff}
.nav-btn.active{background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.4);color:#E6FBFF;box-shadow:inset 3px 0 0 #22D3EE}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-family:'Chakra Petch',sans-serif;letter-spacing:.06em;border:1px solid #2A3A4C;white-space:nowrap}
.st-ok{color:#6EE7B7;border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
.st-warn{color:#FCD34D;border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.st-crit{color:#FFB4AC;border-color:rgba(255,90,78,.7);background:rgba(255,90,78,.12)}
.st-off{color:#A9B6C4;border-color:#2A3A4C;background:#121A23}
.st-info{color:#A5F3FC;border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.08)}
.mode-run{color:#6EE7B7;border-color:#34D399}
.mode-ramp{color:#93C5FD;border-color:#60A5FA}
.mode-stop{color:#CBD5E1;border-color:#64748B}
.mode-fault{color:#fff;border-color:#FF5A4E;background:#7F1D1D;animation:blink 1s steps(2) infinite}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.live-dot{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.7);animation:ping 1.6s infinite}
.kpi{font-family:'Chakra Petch',sans-serif;font-size:34px;font-weight:600;line-height:1.1;color:#F8FBFD}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.bar{height:6px;background:#1A2430;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .6s ease}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B6;padding:8px 10px;border-bottom:1px solid #223040;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid #18222D;vertical-align:top}
.tbl tr.hl td{background:rgba(34,211,238,.06)}
.trow{display:grid;gap:10px;align-items:center;padding:9px 10px;border-bottom:1px solid #18222D;font-size:13px}
.trow.hl{background:rgba(34,211,238,.07)}
.thd{font-family:'Chakra Petch',sans-serif;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#93A4B6;border-bottom-color:#223040}
.scroll-x{overflow-x:auto}
.screen{animation:fadeUp .35s ease both}
.card-btn{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;padding:14px;border-radius:10px;border:1px solid #223040;background:rgba(15,21,28,.94);color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.card-btn:hover{border-color:#3B5068;transform:translateY(-2px)}
.card-btn.sel{border-color:#22D3EE;box-shadow:0 0 0 1px #22D3EE,0 0 24px rgba(34,211,238,.15)}
.card-btn.crit{border-color:rgba(255,90,78,.8);animation:critGlow 1.6s ease-in-out infinite}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #1B2632;background:#0F151C;color:inherit;font:inherit;cursor:pointer}
.row-btn:hover{border-color:#3B5068}
.row-btn.sel{border-color:#22D3EE;background:rgba(34,211,238,.06)}
.banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border-radius:10px;border:1px solid}
.banner-crit{background:#2A0D0B;border-color:#FF5A4E;animation:critGlow 1.2s ease-in-out infinite}
.banner-warn{background:#261C06;border-color:#F59E0B}
.banner-info{background:#06212A;border-color:#22D3EE}
.banner-crit .b-ico{color:#FF5A4E;animation:blink 1s steps(2) infinite}
.banner-warn .b-ico{color:#FBBF24}
.banner-info .b-ico{color:#22D3EE}
.countdown{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1}
.twin{position:relative;width:100%}
.twin .ov{position:absolute;inset:0}
.hot{position:absolute;transform:translate(-50%,-50%);min-width:48px;height:30px;padding:0 10px;border-radius:15px;border:1.5px solid;background:rgba(10,14,19,.9);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.hot-ok{border-color:#34D399;color:#A7F3D0}
.hot-warn{border-color:#FBBF24;color:#FDE68A;animation:pulseAmber 1.8s infinite}
.hot-crit{border-color:#FF5A4E;color:#FFE1DE;background:#3A0F0C;animation:pulseRed 1s infinite}
.hot-off{border-color:#64748B;color:#CBD5E1}
.hot.sel{outline:2px solid #22D3EE;outline-offset:3px}
.belt{animation:belt .9s linear infinite}
.steam{animation:belt 1.6s linear infinite}
.spray{animation:spray .8s ease-in-out infinite alternate}
.pot{animation:pot 10s linear infinite}
.pot2{animation:pot 10s linear -5s infinite}
.swing{transform-box:fill-box;transform-origin:0% 100%;animation:swing 3.2s ease-in-out infinite}
.twin.paused .belt,.twin.paused .steam,.twin.paused .spray,.twin.paused .pot,.twin.paused .pot2,.twin.paused .swing{animation-play-state:paused}
.seg{position:absolute;top:0;bottom:0}
.seg-run{background:rgba(45,212,191,.55)}
.seg-ramp{background:rgba(96,165,250,.7)}
.seg-planned_stop{background:repeating-linear-gradient(135deg,#334155 0 4px,#1E293B 4px 8px)}
.seg-stop{background:#F59E0B}
.seg-fault{background:#FF5A4E}
.scan{position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(34,211,238,.06),transparent);animation:scan 6s linear infinite;pointer-events:none}
input[type=range]{width:100%;accent-color:#22D3EE;height:28px;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.7)}80%,100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
@keyframes pulseRed{0%{box-shadow:0 0 0 0 rgba(255,90,78,.8)}100%{box-shadow:0 0 0 14px rgba(255,90,78,0)}}
@keyframes pulseAmber{0%{box-shadow:0 0 0 0 rgba(251,191,36,.6)}100%{box-shadow:0 0 0 10px rgba(251,191,36,0)}}
@keyframes critGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,90,78,0)}50%{box-shadow:0 0 28px 0 rgba(255,90,78,.35)}}
@keyframes belt{to{stroke-dashoffset:-24}}
@keyframes spray{from{opacity:.15}to{opacity:.75}}
@keyframes pot{from{transform:translateX(0)}to{transform:translateX(470px)}}
@keyframes swing{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-28deg)}}
@keyframes scan{to{top:100%}}
@media (prefers-reduced-motion: reduce){.belt,.steam,.spray,.pot,.pot2,.swing,.scan,.hot-crit,.hot-warn,.banner-crit,.card-btn.crit,.mode-fault,.live-dot{animation:none}}
</style>

<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak></div>
<script type="text/x-template" id="tpl">


<div class="app">


<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 14px 24px; border-bottom: 1px solid #1B2632; background: rgba(10,14,19,.92); position: relative; overflow: hidden">
  <div class="scan"></div>
  <div style="display: flex; align-items: center; gap: 12px">
    <svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" :stroke="v.accent" style="stroke-width: 2"></polygon>
      <polygon points="20,10 28,15 28,25 20,30 12,25 12,15" :fill="v.accent" opacity="0.18" :stroke="v.accent" style="stroke-width: 1.5"></polygon>
      <circle cx="20" cy="20" r="3.5" :fill="v.accent"></circle>
    </svg>
    <div style="display: flex; flex-direction: column">
      <span class="disp" style="font-size: 20px; font-weight: 700; letter-spacing: .08em; color: #F8FBFD">PM·TWIN</span>
      <span class="lbl" style="font-size: 10px">Predictive Maintenance · Digital Twin</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; min-width: 220px">
    <span style="font-weight: 600; color: #F1F6FA">เครื่องล้างหม้อหุงและฝา</span>
    <span class="muted" style="font-size: 12px">Pot &amp; Lid Washing Machine · Rice Production &amp; Cooking Line</span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; margin-left: auto; flex-wrap: wrap">
    <span class="chip st-info"><span class="live-dot"></span>{{ v.srcLabel }}</span>
    <span :class="`chip ${v.modeCls}`">{{ v.modeEn }} · {{ v.modeTh }}</span>
    <div style="display: flex; flex-direction: column; align-items: flex-end">
      <span class="mono" style="font-size: 24px; font-weight: 600; color: #F8FBFD; line-height: 1">{{ v.clockTime }}<span style="font-size: 15px; color: #93A4B6">{{ v.clockSec }}</span></span>
      <span class="muted" style="font-size: 12px">{{ v.clockDate }}</span>
    </div>
  </div>
</header>

<template v-if="v.loading">
  <div style="padding: 80px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <span class="live-dot"></span>
    <span class="muted">กำลังโหลดผลการทำนายจากโมเดล LSTM-Autoencoder…</span>
  </div>
</template>
<template v-if="v.err">
  <div style="padding: 80px 24px; text-align: center; color: #FFB4AC">โหลดข้อมูลไม่สำเร็จ: {{ v.err }}</div>
</template>

<template v-if="v.ready">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start">


<nav aria-label="เมนูหลัก" style="flex: 1 1 230px; max-width: 100%; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px">
  <span class="lbl" style="padding: 4px 12px 8px">เมนู</span>
  <template v-for="(t, $index) in (v.tabs || [])">
    <button :class="t.cls" @click="t.go">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" style="stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none" aria-hidden="true"><path :d="t.icon"></path></svg>
      <span style="display: flex; flex-direction: column; line-height: 1.25">
        <span style="font-size: 14px">{{ t.th }}</span>
        <span class="lbl" style="font-size: 9.5px; letter-spacing: .1em">{{ t.en }}</span>
      </span>
      <template v-if="t.badge"><span class="chip st-crit" style="margin-left: auto; padding: 1px 8px">{{ t.badge }}</span></template>
    </button>
  </template>

  <div class="panel" style="margin-top: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
    <span class="lbl">Data Control</span>
    <template v-if="v.isLive">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span class="chip st-ok" style="align-self: flex-start"><span class="live-dot"></span>LIVE · ตามเวลาประเทศไทย</span>
        <span class="muted" style="font-size: 11.5px">{{ v.liveNote }}</span>
        <button class="btn" @click="v.goReplay">เปลี่ยนเป็นโหมด Replay</button>
      </div>
    </template>
    <template v-if="v.isReplay">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <button class="btn btn-primary" @click="v.goLive">กลับสู่ LIVE (เวลาไทย)</button>
        <div style="display: flex; gap: 8px">
          <button class="btn" @click="v.togglePlay" :aria-label="v.playLabel" style="flex: 1">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" style="stroke-width: 2; stroke-linejoin: round" aria-hidden="true"><path :d="v.playIcon"></path></svg>
            {{ v.playLabel }}
          </button>
        </div>
        <div style="display: flex; gap: 6px">
          <template v-for="(sp, $index) in (v.speeds || [])">
            <button :class="sp.cls" @click="sp.set" style="flex: 1; padding: 0 6px">{{ sp.label }}</button>
          </template>
        </div>
      </div>
    </template>
    <input type="range" min="0" :max="v.maxFrame" :value="v.frame" @input="v.onScrub" aria-label="เลื่อนเวลา Replay">
    <div style="display: flex; justify-content: space-between; font-size: 11px" class="mono muted"><span>{{ v.replayStartLbl }}</span><span>{{ v.replayEndLbl }}</span></div>
    <span class="lbl" style="margin-top: 4px">ข้ามไปยังเหตุการณ์</span>
    <template v-for="(j, $index) in (v.jumps || [])">
      <button class="btn" @click="j.go" style="justify-content: flex-start; min-height: 36px; font-size: 12px"><span class="mono" style="color: #67E8F9">{{ j.time }}</span>{{ j.label }}</button>
    </template>
    <p class="muted" style="font-size: 11.5px; margin: 4px 0 0">กดข้ามเหตุการณ์หรือเลื่อนแถบเวลาเพื่อเข้าสู่โหมด Replay · เมื่อเชื่อม API กับ Node-RED / SQL Server ข้อมูล LIVE จะมาจากเครื่องจริง</p>
  </div>
</nav>


<main style="flex: 999 1 640px; min-width: 0; padding: 18px 24px 40px; display: flex; flex-direction: column; gap: 18px">

<template v-if="v.banner.show">
  <div :class="v.banner.cls" role="alert">
    <svg class="b-ico" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" style="stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5"></path><path d="M12 18v.5"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 360px; min-width: 0">
      <span class="disp" style="font-size: 18px; font-weight: 700; color: #fff">{{ v.banner.title }}</span>
      <span style="color: #E6EDF3">{{ v.banner.text }}</span>
    </div>
    <template v-if="v.banner.hasCount">
      <div style="display: flex; flex-direction: column; align-items: flex-end">
        <span class="lbl">Time to failure</span>
        <span class="countdown" style="color: #fff">{{ v.banner.count }}</span>
      </div>
    </template>
  </div>
</template>


<template v-if="v.scr.overview">
<section class="screen" style="display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
    <h1 class="disp" style="margin: 0; font-size: 26px; font-weight: 600">ภาพรวมเครื่องจักร</h1>
    <span class="lbl">Machine Overview · Digital Twin State</span>
  </div>
  <div class="grid-auto">
    <div class="panel" style="display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 92px; height: 92px; flex: none">
        <svg viewBox="0 0 100 100" width="92" height="92" aria-hidden="true" style="display: block">
          <circle cx="50" cy="50" r="42" fill="none" stroke="#1A2430" style="stroke-width: 9"></circle>
          <circle cx="50" cy="50" r="42" fill="none" :stroke="v.kpi.healthColor" transform="rotate(-90 50 50)" :style="`stroke-width: 9; stroke-linecap: round; stroke-dasharray: ${v.kpi.healthDash}; transition: stroke-dasharray .6s`"></circle>
        </svg>
        <span class="disp" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; color: #F8FBFD">{{ v.kpi.healthStr }}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span class="lbl">Machine Health</span>
        <span style="font-weight: 600">สุขภาพเครื่องจักรรวม</span>
        <span :class="`chip ${v.kpi.healthCls}`" style="align-self: flex-start">{{ v.kpi.healthTh }}</span>
      </div>
    </div>
    <div class="panel" style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Availability วันนี้</span>
      <span class="kpi">{{ v.kpi.avail }}</span>
      <span class="muted" style="font-size: 12px">เดินเครื่อง {{ v.kpi.runToday }} · ไม่นับช่วงพักตามแผน</span>
    </div>
    <div class="panel" style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">Active Alerts</span>
      <span class="kpi" :style="`color: ${v.kpi.alertColor}`">{{ v.kpi.alerts }}</span>
      <span class="muted" style="font-size: 12px">วิกฤต {{ v.kpi.nCrit }} · เฝ้าระวัง {{ v.kpi.nWarn }} · ปกติ {{ v.kpi.nOk }} Part</span>
    </div>
    <div class="panel" style="display: flex; flex-direction: column; gap: 6px">
      <span class="lbl">AI Model Accuracy (AP)</span>
      <span class="kpi">{{ v.kpi.ap }}</span>
      <span class="muted" style="font-size: 12px">LSTM-Autoencoder · แจ้งล่วงหน้า {{ v.kpi.lead }}</span>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 18px">
    <div class="panel" style="flex: 3 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px">
        <h2 class="h2">Anomaly Score (Real-time)</h2>
        <span class="muted" style="font-size: 12px">e(t) / threshold ของโหมดปัจจุบัน · 4 ชั่วโมงล่าสุด · log scale</span>
      </div>
      <svg viewBox="0 0 640 200" width="100%" style="display: block" aria-label="กราฟ Anomaly score">
        <template v-for="(yt, $index) in (v.scoreChart.yTicks || [])">
          <line x1="36" x2="630" :y1="yt.y" :y2="yt.y" stroke="#1B2632"></line>

    const contrib = ranked.map((x, k) => ({ rank: k + 1, name: x.id + ' · ' + x.dv.name, w: Math.min(100, Math.log10(1 + x.hi) / lc * 100).toFixed(1), hi: x.hi.toFixed(2) + '×', color: ST[x.st].c }));

    // ---- timeline ----
    const rday = r.start.slice(0, 10);
    const SEGTH = { run: 'RUN', ramp: 'RAMP-UP', planned_stop: 'พักตามแผน', stop: 'หยุดนอกแผน', fault: 'FAULT' };
    const gantt = d.timeline.map((day) => {
      const isToday = day.d === rday;
      const segs = [];
      day.segments.forEach((sg) => {
        let a = sg[0], b = sg[1];
        if (isToday) { if (a >= minOfDay) return; b = Math.min(b, minOfDay); }
        segs.push({ cls: 'seg seg-' + sg[2], l: (a / 1440 * 100).toFixed(2), w: Math.max(0.15, (b - a) / 1440 * 100).toFixed(2), title: SEGTH[sg[2]] + ' ' + clock(a) + '–' + clock(b) });
      });
      return { label: shortDate(day.d), isToday: isToday, nowX: (minOfDay / 1440 * 100).toFixed(2), segs: segs, lblColor: isToday ? '#67E8F9' : '#A9B6C4' };
    }).reverse();
    const hourTicks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map((h) => ({ x: (h / 24 * 100).toFixed(2), label: pad(h % 24) + ':00' }));
    const DX = (k) => 30 + k / (n - 1) * 965;
    const DY = (v) => logY(v, 0.3, 30, 10, 128);
    const dxt = []; for (let k = 0; k < n; k += 120) dxt.push({ x: DX(k).toFixed(1), label: hm(addMin(C.t0, k)) });
    const dayChart = { path: linePath(r.score, 0, i, DX, DY), thrY: DY(1).toFixed(1), nowX: DX(i).toFixed(1), xTicks: dxt, stops: bands((k) => r.mode[k] === 'stop', 0, i, DX), alarms: bands((k) => r.alarm[k] === 1, 0, i, DX) };
    const keyEvents = visible.filter((a) => a.type !== 'health').slice(-12).reverse().map((a) => ({ time: hm(addMin(C.t0, a.k)), text: a.text, color: sevCol[a.sev] }));

    // ---- runtime ----
    const maxH = Math.max.apply(null, devs.map((x) => x.runtimeH));
    const nDays = dayIdx + minOfDay / 1440;
    const rtRows = devs.map((x) => ({ id: x.id, th: x.dv.th, hours: x.runtimeH.toFixed(1) + ' ชม.', w: (x.runtimeH / maxH * 100).toFixed(1), starts: x.starts, perDay: (x.runtimeH / nDays).toFixed(1) + ' ชม.', stCls: x.running ? 'st-ok' : 'st-off', state: x.running ? 'กำลังทำงาน' : 'หยุด' }));
    let prevRun = 0; for (let k = 0; k < dayIdx; k++) prevRun += d.daily[k].run_h;
    const machineH = prevRun + runM / 60;
    const rt = { machineH: machineH.toFixed(1) + ' ชม.', since: thDate(parseDT(d.meta.period[0].slice(0, 16))), todayH: fmtDur(runM), util: (machineH / (nDays * 24) * 100).toFixed(1) + '%', days: String(dayIdx + 1) };

    // ---- model ----
    const tb = d.model.table;
    const pctOf = (v) => v == null ? '—' : (v * 100).toFixed(1) + '%';
    const loc = d.model.localization[0];
    const hit1 = loc && loc.top_devices[0] === rdevId;
    const mk = [
      { label: 'Average Precision', sub: 'Threshold-free · Test', val: pctOf(main.AP), dash: ringDash(main.AP * 100, 40), color: '#22D3EE' },
      { label: 'Event Recall', sub: 'ตรวจพบเหตุการณ์ความเสียหาย', val: pctOf(main.event_recall), dash: ringDash(main.event_recall * 100, 40), color: '#34D399' },
      { label: 'Event Precision', sub: 'Alarm episode ที่ถูกต้อง', val: pctOf(main.event_precision), dash: ringDash(main.event_precision * 100, 40), color: '#FBBF24' },
      { label: 'Event F0.5', sub: 'เน้น Precision มากกว่า Recall', val: pctOf(main['event_F0.5']), dash: ringDash(main['event_F0.5'] * 100, 40), color: '#A78BFA' },
      { label: 'Localization Hit@1', sub: 'ระบุ Part ต้นเหตุถูกอันดับ 1', val: hit1 ? '100.0%' : '0.0%', dash: ringDash(hit1 ? 100 : 0, 40), color: '#F472B6' },
      { label: 'Detection Lead Time', sub: 'ล่วงหน้า ' + kpi.lead + ' จากกรอบ ' + d.model.eval.horizon_h + ' ชม. · FA ' + main.FA_per_week + '/สัปดาห์', val: (Math.min(100, (main.lead_time_h[0] || 0) / d.model.eval.horizon_h * 100)).toFixed(1) + '%', dash: ringDash(Math.min(100, (main.lead_time_h[0] || 0) / d.model.eval.horizon_h * 100), 40), color: '#FB923C' }
    ];
    const modelRows = tb.map((t, k) => ({ name: t.name, ap: pctOf(t.AP), f05: t['event_F0.5'].toFixed(3), fa: t.FA_per_week.toFixed(2), lead: t.lead_time_h.length ? t.lead_time_h[0].toFixed(2) + ' h' : 'ไม่ตรวจพบ', first: t.first_alarm_dt ? t.first_alarm_dt.slice(5, 16) : '—', cls: 'trow' + (k === 0 ? ' hl' : '') }));
    const ls = d.model.loss, vl = d.model.val_loss;
    const lmin = Math.min.apply(null, ls.concat(vl)), lmax = Math.max.apply(null, ls.concat(vl));
    const LX = (k) => 44 + k / (ls.length - 1) * 466;
    const LY = (v) => 180 - (v - lmin) / (lmax - lmin) * 164;
    const lossChart = { train: linePath(ls, 0, ls.length - 1, LX, LY), val: linePath(vl, 0, vl.length - 1, LX, LY), yTicks: [lmin, lmin + (lmax - lmin) / 3, lmin + 2 * (lmax - lmin) / 3, lmax].map((v) => ({ y: LY(v).toFixed(1), label: v.toFixed(2) })) };
    const th = d.model.thresholds;
    const cfg = [
      { k: 'Architecture', v: 'LSTM Autoencoder (seq2seq)' },
      { k: 'Window length w', v: d.model.window + ' นาที' },
      { k: 'Input channels d', v: d.model.channels + ' channels' },
      { k: 'Encoder depth', v: d.model.depth + ' layers (32 → 8)' },
      { k: 'Latent dimension', v: d.model.latent + ' units' },
      { k: 'Optimizer / LR', v: 'Adam · 0.001' },
      { k: 'Batch size', v: '128' },
      { k: 'Loss', v: 'Mean squared error' },
      { k: 'Early stopping', v: 'patience 10 · ' + d.model.epochs + ' epochs' },
      { k: 'Parameters', v: d.model.params.toLocaleString() },
      { k: 'Threshold (RUN / RAMP)', v: th.run.toFixed(3) + ' / ' + th.ramp.toFixed(3) },
      { k: 'Persistence k', v: d.model.k + ' นาที' }
    ];
    const sp = d.meta.split;
    const splits = [['Train', sp.train], ['Validation', sp.val], ['Test', sp.test]].map((x) => ({ name: x[0], range: shortDate(x[1][0].slice(0, 10)) + ' – ' + shortDate(x[1][1].slice(0, 10)), rows: x[1][2].toLocaleString() + ' แถว' }));
    const locRows = loc ? [
      { k: 'เหตุการณ์', v: shortDate(loc.event.slice(0, 10)) + ' ' + loc.event.slice(11, 16) },
      { k: 'Top-3 channels', v: loc.top_channels.join(', ') },
      { k: 'Top-3 Parts', v: loc.top_devices.join(' > ') },
      { k: 'Hit@1 / Hit@3', v: (hit1 ? '1/1' : '0/1') + ' · ' + (loc.top_devices.indexOf(rdevId) >= 0 ? '1/1' : '0/1') }
    ] : [];
    const st0 = d.model.stability;
    const stab = st0 ? { show: true, n: st0.n, rows: st0.rows } : { show: false, rows: [] };
    const model = { pct: main.percentile, k: d.model.k, horizon: d.model.eval.horizon_h, epochs: d.model.epochs };

    // ---- daily ----
    const daily14 = d.daily.slice(Math.max(0, dayIdx - 14), dayIdx).reverse().map((x) => ({ d: shortDate(x.d), run: x.run_h.toFixed(1), stop: x.stop_h.toFixed(1), alarm: x.alarm_min, alarmColor: x.alarm_min > 0 ? '#FCD34D' : '#A9B6C4', max: x.max_score == null ? '—' : x.max_score.toFixed(2) + '×' }));

    const bk = s.live && s.bkk ? s.bkk : null;
    const liveDate = bk ? new Date(bk.y, bk.mo - 1, bk.d) : null;
    return Object.assign(base, {
      modeCls: mi[2], modeEn: mi[0], modeTh: mi[1],
      clockTime: bk ? pad(bk.h) + ':' + pad(bk.mi) : hm(now), clockSec: bk ? ':' + pad(bk.s) : '',
      clockDate: bk ? thDate(liveDate) + ' · เวลาประเทศไทย (UTC+7)' : thDate(now) + ' · Replay',
      srcLabel: s.live ? 'LIVE · เวลาไทย' : 'REPLAY · CSV 250k',
      liveNote: 'ข้อมูล ณ เวลาเดียวกันจากบันทึกวันที่ ' + thDate(C.t0) + ' (รอเชื่อม API จริง)',
      tabs: tabs, speeds: speeds, jumps: jumps, playLabel: s.playing ? 'หยุดชั่วคราว' : 'เล่น', playIcon: s.playing ? 'M8 5v14M16 5v14' : 'M7 5l12 7-12 7z',
      togglePlay: () => this.setState({ playing: !s.playing }), maxFrame: n - 1, frame: i,
      onScrub: (e) => this.setState({ i: parseInt(e.target.value, 10) || 0, live: false }),
      isLive: s.live, isReplay: !s.live, goLive: () => { this.setState({ live: true }); setTimeout(() => this.liveSync(true), 0); }, goReplay: () => this.setState({ live: false, playing: true }),
      replayStartLbl: hm(C.t0), replayEndLbl: hm(addMin(C.t0, n - 1)),
      banner: banner, kpi: kpi, scoreChart: scoreChart, topRisk: topRisk, devices: devices, nextBreak: nb + ' น.',
      goLayout: () => this.setState({ tab: 'layout' }), goReport: () => this.setState({ tab: 'report' }),
      actsShort: actsShort, acts: acts, noActs: acts.length === 0, filters: filters,
      sel: sel, devCards: devCards, fc: fc, hiChart: hiChart, fcRows: fcRows, rulEval: rulEval,
      col: col, hotspots: hotspots, twinCls: twinCls,
      alertsList: alertsList, alertCount: alertsList.length, diag: diag, contrib: contrib,
      gantt: gantt, hourTicks: hourTicks, dayChart: dayChart, keyEvents: keyEvents,
      rtRows: rtRows, rt: rt, mk: mk, modelRows: modelRows, lossChart: lossChart, cfg: cfg, splits: splits, locRows: locRows, stab: stab, model: model,
      daily14: daily14, dataInfo: d.meta.rows.toLocaleString() + ' rows · ' + shortDate(d.meta.period[0].slice(0, 10)) + '–' + shortDate(d.meta.period[1].slice(0, 10)) + ' · 1-min sampling'
    });
  }
}

(function () {
  const comp = new Component({});
  const v = Vue.shallowRef(comp.renderVals());
  let queued = false;
  comp.__onUpdate = function () {
    if (queued) return; queued = true;
    Promise.resolve().then(function () { queued = false; v.value = comp.renderVals(); });
  };
  Vue.createApp({ setup: function () { return { v: v }; }, template: '#tpl' }).mount('#app');
  comp.componentDidMount();
})();
</script>
</body>
